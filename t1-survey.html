<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>第一階段問卷｜六福村動態定價研究</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <div class="site-header">
    <div class="logo">
      <span class="logo-icon">🎢</span>
      <span>六福村主題遊樂園</span>
    </div>
    <div class="academic-tag">🎓 研究模擬</div>
  </div>

  <div class="progress-bar"><div class="progress-fill" style="width: 25%"></div></div>

  <div class="survey-intro">
    <h2>📝 第一階段問卷（1/3）</h2>
    <p>請依照您剛才看到的<strong>票價資訊（成人票 NT$1,400）</strong>，依照您的真實感受作答。每題請選擇最符合您想法的選項。</p>
  </div>

  <form id="survey-form" novalidate>
    <div class="question-list" id="question-list"></div>

    <div class="section">
      <button id="submit-btn" type="submit" class="btn btn-primary btn-large btn-full">
        提交第一階段問卷 →
      </button>
    </div>
  </form>

  <div class="site-footer">
    <strong>※ 學術研究模擬頁面 ※</strong>
    本網站為東海大學 數位創新碩士學位學程學術研究模擬頁面
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/session.js"></script>
<script src="js/tracking.js"></script>
<script src="js/survey.js"></script>
<script>
if (!window.leofooSession.checkProgress('t1_survey')) { /* 已重定向 */ }
window.leofooTrack.trackPageView('T1', { page: 't1_survey' });

// T1 題目定義（合理性、公平性、購買意願 + 校準題 + 注意力 + 控制）
const T1_QUESTIONS = [
  // 價格認知校準（固定第 1 題）
  {
    type: 'single',
    qid: 't1_price_perception',
    text: '你認為六福村成人票 NT$1,400 在台灣遊樂園市場屬於：',
    options: ['偏低', '合理', '偏高', '非常高'],
    fixed: true
  },
  // 隨機呈現的核心題
  { type: 'likert', qid: 't1_reason_1', text: '我覺得這個價格是合理的' },
  { type: 'likert', qid: 't1_reason_2', text: '我覺得這個價格在邏輯上說得通' },
  { type: 'likert', qid: 't1_fair_1', text: '我覺得這個價格對消費者來說是公平的' },
  { type: 'likert', qid: 't1_fair_2', text: '我覺得業者沒有佔消費者便宜' },
  { type: 'likert', qid: 't1_intent_1', text: '在這個價格下，我願意購買這張票' },
  { type: 'likert', qid: 't1_intent_2', text: '我會考慮購買這張票' },
  // 注意力檢核（隨機混入）
  { type: 'likert', qid: 't1_attention', text: '為確認您仔細閱讀，本題請選擇「有點不同意」（左邊第 3 個選項）' },
  // 控制變項（固定最後）
  {
    type: 'yesno',
    qid: 't1_familiar',
    text: '我過去有去過六福村主題遊樂園',
    fixed_last: true
  }
];

// 隨機化（保留 fixed 題目位置）
const fixedFirst = T1_QUESTIONS.filter(q => q.fixed);
const fixedLast = T1_QUESTIONS.filter(q => q.fixed_last);
const middle = T1_QUESTIONS.filter(q => !q.fixed && !q.fixed_last);
const shuffled = window.leofooSurvey.shuffle(middle);
const finalOrder = [...fixedFirst, ...shuffled, ...fixedLast];

// 渲染
const listEl = document.getElementById('question-list');
let html = '';
finalOrder.forEach((q, idx) => {
  const num = idx + 1;
  if (q.type === 'likert') {
    html += window.leofooSurvey.renderLikertQuestion(q.qid, q.text, num);
  } else if (q.type === 'single') {
    html += window.leofooSurvey.renderSingleChoice(q.qid, q.text, num, q.options);
  } else if (q.type === 'yesno') {
    html += window.leofooSurvey.renderYesNo(q.qid, q.text, num);
  }
});
listEl.innerHTML = html;
window.leofooSurvey.setupAnswerWatcher();
window.leofooSurvey.setupGatekeeping('submit-btn', {
  customLabel: '提交第一階段問卷'
});

// 提交
document.getElementById('survey-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  // 雙重保險：再次驗證（按鈕禁用應該已經擋住，但保險起見）
  if (!window.leofooSurvey.validateAllAnswered()) {
    return;
  }

  window.leofooSurvey.showLoading('提交中...');

  const questionOrder = finalOrder.map(q => q.qid);
  const answers = window.leofooSurvey.collectAnswers(questionOrder);

  const ok = await window.leofooSurvey.submitAnswers(answers, 'T1');
  if (!ok) {
    window.leofooSurvey.hideLoading();
    alert('提交失敗，請檢查網路後重試');
    return;
  }

  // 隨機分組
  await window.leofooSession.assignRandomGroup();

  window.leofooSession.saveProgress('filler');
  window.location.href = 'filler.html';
});
</script>
</body>
</html>
