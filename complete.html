<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>完成｜感謝您的參與</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
/* ===== 六福村桃紅風格（T1/T2/T3 共用）===== */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;}
body{background:#f4f4f4;}
.container{max-width:480px;margin:0 auto;background:#f4f4f4;min-height:100vh;}
.site-header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 6px rgba(0,0,0,.08);position:sticky;top:0;z-index:20;}
.brand{display:flex;flex-direction:column;line-height:1;}
.brand .cn{font-size:24px;font-weight:900;color:#E6007E;letter-spacing:2px;}
.brand .en{font-size:9px;font-weight:700;color:#E6007E;letter-spacing:1px;margin-top:2px;}
.brand .sub{font-size:7.5px;color:#E6007E;letter-spacing:3px;margin-top:1px;}
.h-icons{display:flex;align-items:center;gap:15px;}
.h-icons .ico{color:#E6007E;font-size:20px;position:relative;}
.h-icons .cart .dot{position:absolute;top:-5px;right:-8px;background:#fff;border:1.5px solid #E6007E;color:#E6007E;font-size:10px;font-weight:700;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
/* 步驟條 */
.steps{display:flex;background:#E6007E;padding:9px 14px;gap:6px;justify-content:center;align-items:center;}
.steps .s{font-size:13px;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:5px;}
.steps .s.on{color:#fff;font-weight:700;}
.steps .s .c{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:13.5px;}
.steps .s.on .c{background:#fff;color:#E6007E;}
.steps .arrow{color:rgba(255,255,255,.5);font-size:13.5px;}
/* 票券卡（六福村版型）*/
.ticket-feed{padding:14px 14px 2px;}
.tk-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.1);margin-bottom:16px;}
.tk-card.hot{outline:3px solid #E6007E;outline-offset:-1px;}
.tk-img{height:140px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.tk-img .emoji{font-size:58px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));z-index:1;}
.tk-img .pay{position:absolute;top:10px;right:10px;background:linear-gradient(135deg,#E0B84C,#C9982A);color:#fff;font-size:9.5px;font-weight:700;padding:5px 8px;border-radius:7px;text-align:center;line-height:1.3;z-index:3;box-shadow:0 2px 5px rgba(0,0,0,.2);}
.tk-img .brand-mini{position:absolute;top:11px;left:13px;color:#fff;font-size:16px;font-weight:900;letter-spacing:1px;z-index:3;text-shadow:0 1px 3px rgba(0,0,0,.3);}

.tk-name-band{position:absolute;left:0;right:0;bottom:0;height:44px;z-index:2;background:#E6007E;display:flex;align-items:center;justify-content:center;}.tk-name-band .nm{color:#fff;font-size:21px;font-weight:900;letter-spacing:2px;text-shadow:0 1px 2px rgba(0,0,0,.25);}
.tk-info{padding:13px 16px;}
.tk-info .row1{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px;}
.tk-info .tname{font-size:18px;font-weight:800;color:#333;}
.tk-info .ppl{font-size:13.5px;color:#1f1f1f;white-space:nowrap;}
.tk-info .row2{display:flex;justify-content:space-between;align-items:center;}
.tk-info .note{font-size:13.5px;color:#1f1f1f;}
.tk-info .price{font-size:14px;color:#1f1f1f;}
.tk-info .price b{font-size:24px;font-weight:900;color:#E6007E;margin-left:3px;}
.qty{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f0f0f0;margin-top:12px;padding-top:12px;}
.qty .lab{font-size:13px;color:#1f1f1f;font-weight:700;}
.qty .ctrl{display:flex;align-items:center;gap:13px;}
.qty .qb{width:32px;height:32px;border-radius:8px;border:1.5px solid #E6007E;color:#E6007E;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;background:#fff;}
.qty .qn{font-size:17px;font-weight:800;min-width:18px;text-align:center;}
/* T2 訂單卡（單張漲價票）*/
.order-card{background:#fff;border-radius:14px;padding:0 0 14px;box-shadow:0 3px 12px rgba(0,0,0,.1);margin:14px 14px 0;overflow:hidden;}
.order-top{height:120px;background:linear-gradient(135deg,#fdd0e7,#f9a8d4);position:relative;display:flex;align-items:center;justify-content:center;}
.order-top .flags{position:absolute;top:0;left:0;right:0;height:18px;background:repeating-linear-gradient(90deg,#E6007E 0 14px,#00AEEF 14px 28px,#F7941E 28px 42px);opacity:.8;}
.order-top .brand-mini{position:absolute;top:11px;left:13px;color:#fff;font-size:16px;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.3);}
.order-top .emoji{font-size:54px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));}
.order-title{font-weight:800;font-size:16px;color:#333;text-align:center;padding:14px 16px 4px;}
.order-tag{display:inline-block;background:#E6007E;color:#fff;font-size:13.5px;font-weight:700;padding:3px 10px;border-radius:6px;margin:0 auto;}
.order-tagwrap{text-align:center;margin-bottom:8px;}
.order-body{text-align:center;padding:4px 0;}
.price-display{font-weight:900;font-size:38px;color:#E6007E;line-height:1.1;}
.price-currency{font-size:18px;margin-right:2px;}
.price-label{font-size:13px;color:#1f1f1f;margin-bottom:3px;}
.price-old{font-size:17px;color:#555;text-decoration:line-through;}
.price-arrow{color:#E6007E;font-size:14px;margin:3px 0;}
.features{list-style:none;margin:12px 16px 0;border-top:1px solid #f0f0f0;padding-top:12px;}
.features li{font-size:13px;color:#1f1f1f;padding:3px 0 3px 20px;position:relative;}
.features li::before{content:"✓";position:absolute;left:2px;color:#E6007E;font-weight:800;}
/* 策略框 */
.strategy-box{display:flex;gap:11px;align-items:flex-start;border-radius:11px;padding:13px 14px;margin:14px 16px 0;}
.strategy-box.box-b{background:#EAF6FB;border:1px solid #c5e6f5;}
.strategy-box.box-d{background:#FFF0F6;border:1px solid #f8cfe2;}
.strategy-box.box-e{background:#FFF3E9;border:1px solid #f8d9bd;}
.strategy-icon{font-size:22px;flex:0 0 auto;}
.strategy-content{font-size:13px;color:#555;line-height:1.6;}
.strategy-content strong{display:block;font-size:14px;color:#E6007E;margin-bottom:2px;}
.strategy-content .highlight{color:#E6007E;font-weight:800;}
/* 商家回饋框（問卷包裝）*/
.feedback-card{background:#fff;border:2px solid #f8cfe2;border-radius:14px;padding:16px;margin:16px 14px;}
.fb-head{display:flex;align-items:center;gap:9px;margin-bottom:5px;}
.fb-head .ic{font-size:20px;}
.fb-head .t{font-size:16px;font-weight:800;color:#E6007E;}
.fb-sub{font-size:13.5px;color:#1f1f1f;line-height:1.6;margin-bottom:8px;}
/* survey.js 題目 → 桃紅風格 */
.question-item{background:transparent;border:none;padding:14px 0 4px;border-top:1px solid #f3f3f3;margin-top:8px;}
.question-item:first-of-type{border-top:none;}
.question-text{font-size:14.5px;color:#3b3b3b;font-weight:600;line-height:1.5;margin-bottom:10px;}
.question-number{display:inline-block;color:#444;font-size:12px;font-weight:700;margin-right:6px;}
.likert-scale{display:flex;gap:5px;}
.likert-option{flex:1;}
.likert-option input{display:none;}
.likert-option label{display:block;border:1.5px solid #edd4e1;border-radius:9px;padding:11px 2px;text-align:center;cursor:pointer;background:#fff;}
.likert-option label span:last-child{display:none;}
.likert-number{font-size:15px;font-weight:800;color:#3a3a3a;}
.likert-option input:checked + label{background:#E6007E;border-color:#E6007E;}
.likert-option input:checked + label .likert-number{color:#fff;}
.likert-labels{display:flex;justify-content:space-between;font-size:13px;color:#333;margin-top:5px;}
.choice-list{display:flex;flex-direction:column;gap:7px;}
.choice-option input{display:none;}
.choice-option label{display:block;border:1.5px solid #edd4e1;border-radius:9px;padding:11px 14px;font-size:14px;color:#444;cursor:pointer;background:#fff;}
.choice-option input:checked + label{background:#E6007E;border-color:#E6007E;color:#fff;font-weight:700;}
/* 按鈕 */
.btn,.btn-primary{width:100%;background:#E6007E;color:#fff;border:none;font-size:17px;font-weight:800;padding:16px;border-radius:13px;cursor:pointer;box-shadow:0 5px 16px rgba(230,0,126,.32);margin-top:8px;letter-spacing:1px;}
.btn:disabled{background:#e0b8cd;box-shadow:none;cursor:default;}
.loading{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.consent{font-size:13.5px;color:#1f1f1f;text-align:center;padding:0 20px 14px;line-height:1.6;}
.site-footer{background:#333;color:#ededed;font-size:12px;line-height:1.7;text-align:center;padding:16px 20px 24px;}
.site-footer strong{color:#E6007E;display:block;margin-bottom:4px;}
</style><style>
:root{--text:#1f1f1f;--text-light:#1f1f1f;--text-lighter:#333;--accent:#E6007E;--accent-dark:#c30068;--success:#E6007E;--bg-section:#fdeef5;--border:#f0d9e5;}
.progress-bar{height:5px;background:#f0d9e5;}
.progress-fill{background:#E6007E !important;}
.survey-intro{background:#fff !important;border:2px solid #f8cfe2 !important;border-left:5px solid #E6007E !important;border-radius:12px;padding:14px 16px;margin:14px;}
.survey-intro h2{color:#E6007E !important;font-size:17px;margin-bottom:5px;}
.survey-intro p{color:#1f1f1f !important;font-size:13.5px;line-height:1.6;}
.intro-card,.complete-card{background:#fff;border-radius:14px;padding:24px 18px;margin:14px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.08);}
.complete-emoji{font-size:54px;}
.complete-title{font-size:23px;font-weight:900;color:#E6007E !important;margin:10px 0;}
.complete-message,.complete-card p,.section p,.alert{color:#1f1f1f !important;font-size:14px !important;line-height:1.8;}
.alert{background:#fdeef5 !important;border-radius:10px;padding:12px 14px;}
.alert-info{background:#eaf6fb !important;}
.text-center{text-align:center;}
</style>
<style>.question-number{background:#E6007E !important;color:#fff !important;border-color:#E6007E !important;}</style>
</head>
<body>
<div class="container">
  <div class="site-header"><div class="brand"><span class="cn">六福村</span><span class="en">LEOFOO VILLAGE</span><span class="sub">主題遊樂園</span></div><div class="h-icons"><span class="ico cart">🛒<span class="dot">1</span></span><span class="ico">👤</span><span class="ico">☰</span></div></div>

  <div class="progress-bar"><div class="progress-fill" style="width: 100%; background: var(--success);"></div></div>

  <div class="intro-card complete-card">
    <div class="complete-emoji">🎉</div>
    <div class="complete-title">感謝您的參與！</div>
    <div class="complete-message">
      您已完成本研究問卷。<br>
      您的回答對本研究極具價值，將協助我們了解消費者對動態定價的真實看法。
    </div>

    <div class="alert alert-info" style="margin: 16px 0; text-align: left;">
      💡 <span><strong>關於本研究：</strong>本研究探討消費者在面對動態定價時的公平感與購買意願，研究成果將作為東海大學 數位創新碩士學位學程之碩士論文資料。</span>
    </div>

    <div class="alert" style="background: var(--bg-section); margin: 16px 0; text-align: left;">
      📌 <span><strong>溫馨提醒：</strong>請勿將本問卷連結轉發給已填答過的朋友，重複填答將影響研究結果的準確性。</span>
    </div>
  </div>

  <div class="section text-center">
    <p style="font-size: 13px; color: var(--text-light); line-height: 1.8;">
      您可以安全地關閉此頁面<br>
      所有回答已成功儲存
    </p>
  </div>

  <div class="site-footer">
    <strong>※ 學術研究模擬頁面 ※</strong>
    本網站為東海大學 數位創新碩士學位學程學術研究模擬頁面<br>
    非真實購票系統，與六福村實業股份有限公司無任何關聯<br>
    填答資料僅供學術研究使用
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
<script src="js/supabase-config.js"></script>
<script src="js/session.js"></script>
<script src="js/tracking.js"></script>
<script>
window.leofooTrack.trackPageView('final', { page: 'complete' });

// 清除 session 防止使用者重新填答
setTimeout(() => {
  // 5 分鐘後清除 sessionStorage，避免使用者誤觸返回鍵
  // sessionStorage.clear();  // 暫時不清除，保留以防需要重新檢視
}, 300000);
</script>
</body>
</html>
